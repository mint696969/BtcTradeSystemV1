# path: ./btcts_next/config/schema/exchanges_def.yaml
# desc: 取引所登録の既定（辞書型）。current(exchanges.yaml)へ後勝ちマージ。

exchanges:
  bitflyer:
    enabled: true
    label: "bitFlyer"
    rate:
      # 事実値: 500/5min/IP = 1.6667 rps
      max_rps: 1.6667
      burst: 2

secrets:
  # secrets.ini 等のキー名定義のみ（値は別管理）
  bitflyer:
    api_key: ""
    api_secret: ""
