# path: ./btcts_next/config/schema/health_def.yaml
# desc: Health タブ UI既定（自動更新と期間プリセット / 判定閾値・表示順）

auto_refresh:
  enabled: false
  interval_sec: 5

periods: ["1m", "5m", "10m", "30m", "1h"]

age_thresholds_sec:
  warn: 3.0
  crit: 10.0

order:
  - bitflyer/orderbook
  - bitflyer/trades

latency_ms:
  # collector 側の標準的なレイテンシ想定（ms）
  warn: 400
  crit: 1200

slo:
  ticker:
    max_stale_s: 5
  orderbook:
    max_stale_s: 6
  trades:
    max_stale_s: 5

palette:
  card_border:
    ok: "#10b981"
    warn: "#f59e0b"
    crit: "#ef4444"
  bar_fill:
    ok: "#d1fae5"
    warn: "#fef3c7"
    crit: "#fee2e2"
  card_fill:
    ok: "#ecfdf5"
    warn: "#fffbeb"
    crit: "#fef2f2"
