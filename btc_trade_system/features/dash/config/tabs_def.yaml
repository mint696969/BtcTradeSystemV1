# path: ./btc_trade_system/features/dash/config/tabs_def.yaml
# desc: タブ構成の既定（順序・表示名・有効/無効）。current は ./btc_trade_system/config/tabs.yaml

order:
  - main
  - health
  - audit_dev

tabs:
  main:
    enabled: true
    dashboard: true # ui_main.py を自動推定（= ui_<key>.py）
    settings: false # 設定タブを持たない
    title_dash: "メイン"
    title_set: ""

  health:
    enabled: true
    dashboard: true # ui_health.py
    settings: true # set_health.py
    title_dash: "健全性"
    title_set: "健全性 設定"

  audit_dev:
    enabled: true
    dashboard: "audit_dev" # 明示。ui_audit_dev.py を使用
    settings: false
    title_dash: "開発監査"
    title_set: ""
