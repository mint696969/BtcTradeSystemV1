# path: btc_trade_system/features/dash/config/tabs_def.yaml
# desc: タブ構成の既定（順序・表示名・有効/無効）。current は ./btc_trade_system/config/tabs.yaml

order:
  - main
  - health
  - audit_dev
  - dash

tabs:
  health:
    enabled: true
    dashboard: true # ui_health.py
    settings: true # set_health.py
    title_dash: "健全性"
    title_set: "健全性 設定"

  audit_dev:
    enabled: true
    dashboard: "audit_dev" # 明示。ui_audit_dev.py を使用
    settings: false
    title_dash: "開発監査"
    title_set: ""

  main:
    enabled: true
    dashboard: true # ui_main.py を表示
    settings: "main" # set_main.py を使用（ギア有効）
    title_dash: "メイン"
    title_set: "メイン設定"

  dash:
    enabled: true
    dashboard: false # ダッシュボードには出さない
    settings: "dash" # set_dash.py を設定タブとして使う
    title_dash: ""
    title_set: "初期設定"
