# path: btc_trade_system/config/ui/collector_def.yaml
# desc: コレクター設定（既定値 / 読み取り専用）。保存先は collector.yaml

order: [bitflyer, binance, bybit, okx]

enabled:
  bitflyer: true
  binance: false
  bybit: false
  okx: false

# exchange レベルのトークンバケット
rates:
  bitflyer: { max_rps: 5.0, burst: 2 }
  binance: { max_rps: 8.0, burst: 4 }
  bybit: { max_rps: 6.0, burst: 3 }
  okx: { max_rps: 6.0, burst: 3 }
