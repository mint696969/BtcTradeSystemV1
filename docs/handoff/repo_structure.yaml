external_roots:
  - name: "btc_ts"
    root: "E:/btc_ts"
    policy:
      purpose: "runtime external root for BTCTS (paths/configs/outputs)"
      secrets: "masked (names hidden)"
      data_logs: "representative only (README etc.)"
    dirs:
      - path: "config/ui"
        desc: "current override (diff-only) YAMLs"
      - path: "config/schema"
        desc: "schema/default YAMLs"
      - path: "data"
        desc: "runtime data root (representative only)"
      - path: "logs"
        desc: "runtime logs root (representative only)"
      - path: "secrets"
        desc: "API keys/tokens (masked; do not include files)"
    files:
      - path: "config/ui/collector.yaml"
